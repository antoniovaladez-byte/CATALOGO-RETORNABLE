<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Catálogo de Retornables</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .header {
      background: #003A8C;
      color: white;
      text-align: center;
      padding: 16px;
    }

    .marca {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .titulo {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .8px;
    }

    .contenedor {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .buscador {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .buscador-titulo {
      font-size: 13px;
      font-weight: 900;
      color: #374151;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    #busqueda {
      width: 100%;
      height: 56px;
      border: 2px solid #d1d5db;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 18px;
      outline: none;
    }

    #busqueda:focus {
      border-color: #003A8C;
    }

    .catalogo-cabecera {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 25px 3px 10px;
    }

    .catalogo-titulo {
      font-size: 18px;
      font-weight: 900;
    }

    #contador {
      color: #6b7280;
      font-size: 13px;
      font-weight: bold;
    }

    .tarjeta {
      background: white;
      border-radius: 15px;
      margin-bottom: 11px;
      padding: 16px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      border-left: 6px solid #003A8C;
      cursor: pointer;
    }

    .tarjeta-superior {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .ubicacion {
      color: #003A8C;
      font-size: 38px;
      font-weight: 900;
    }

    .ruta {
      background: #eef4ff;
      color: #003A8C;
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 900;
    }

    .proveedor {
      margin-top: 12px;
      font-size: 20px;
      font-weight: 900;
    }

    .datos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      margin-top: 7px;
      color: #4b5563;
      font-size: 14px;
      font-weight: 600;
    }

    .mensaje {
      background: white;
      padding: 30px 20px;
      border-radius: 14px;
      text-align: center;
      color: #6b7280;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .contenedor {
        padding: 14px;
      }

      .buscador {
        padding: 14px;
      }

      #busqueda {
        height: 52px;
        font-size: 16px;
      }

      .ubicacion {
        font-size: 34px;
      }
    }
  </style>
</head>


<body>

  <header class="header">
    <div class="marca">PENSKE</div>
    <div class="titulo">CATÁLOGO DE RETORNABLES</div>
  </header>


  <main class="contenedor">

    <section class="buscador">

      <div class="buscador-titulo">
        Buscar retornable
      </div>

      <input
        id="busqueda"
        type="text"
        placeholder="Ubicación, proveedor, número o ruta..."
        autocomplete="off"
      >

    </section>


    <div class="catalogo-cabecera">

      <div class="catalogo-titulo">
        Ubicaciones
      </div>

      <div id="contador"></div>

    </div>


    <div id="lista">
      <div class="mensaje">
        Conectando con base de datos...
      </div>
    </div>

  </main>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzKO78SOXC2oC0OHCe3lOETFjYV5tTWgFdR0N5u9RYMGcGyagaAtd-u_9JrkaqxPxq_/exec?catalogo=1";


    let CATALOGO = [];


    async function cargarCatalogo() {

      try {

        const respuesta =
          await fetch(API_URL);


        if (!respuesta.ok) {
          throw new Error(
            "HTTP " + respuesta.status
          );
        }


        const datos =
          await respuesta.json();


        CATALOGO =
          Array.isArray(datos)
            ? datos
            : [];


        mostrarCatalogo(
          CATALOGO
        );

      }

      catch (error) {

        console.error(error);


        document
          .getElementById("lista")
          .innerHTML =
          '<div class="mensaje">' +
          'No fue posible conectar con la base de datos.' +
          '</div>';

      }

    }


    function mostrarCatalogo(datos) {

      const lista =
        document.getElementById("lista");


      document
        .getElementById("contador")
        .textContent =
        datos.length +
        (
          datos.length === 1
            ? " ubicación"
            : " ubicaciones"
        );


      if (!datos.length) {

        lista.innerHTML =
          '<div class="mensaje">' +
          'No se encontraron resultados.' +
          '</div>';

        return;

      }


      lista.innerHTML = "";


      datos.forEach(
        function(registro) {

          const tarjeta =
            document.createElement("div");


          tarjeta.className =
            "tarjeta";


          tarjeta.innerHTML =

            '<div class="tarjeta-superior">' +

              '<div class="ubicacion">' +
                escaparHTML(
                  registro.ubicacion
                ) +
              '</div>' +

              '<div class="ruta">' +
                escaparHTML(
                  registro.ruta
                ) +
              '</div>' +

            '</div>' +

            '<div class="proveedor">' +
              escaparHTML(
                registro.proveedor
              ) +
            '</div>' +

            '<div class="datos">' +

              '<span>' +
                'No. proveedor: ' +
                escaparHTML(
                  registro.numeroProveedor
                ) +
              '</span>' +

              '<span>' +
                'Máximo: ' +
                escaparHTML(
                  registro.maximo
                ) +
              '</span>' +

            '</div>';


          lista.appendChild(
            tarjeta
          );

        }
      );

    }


    document
      .getElementById("busqueda")
      .addEventListener(
        "input",
        function() {

          const texto =
            normalizar(
              this.value
            );


          if (!texto) {

            mostrarCatalogo(
              CATALOGO
            );

            return;

          }


          const filtrados =
            CATALOGO.filter(
              function(registro) {

                const contenido =
                  normalizar(

                    registro.ubicacion +
                    " " +

                    registro.ruta +
                    " " +

                    registro.proveedor +
                    " " +

                    registro.numeroProveedor +
                    " " +

                    registro.maximo

                  );


                return contenido.includes(
                  texto
                );

              }
            );


          mostrarCatalogo(
            filtrados
          );

        }
      );


    function normalizar(texto) {

      return String(
        texto || ""
      )
        .toUpperCase()
        .trim()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        );

    }


    function escaparHTML(texto) {

      return String(
        texto || ""
      )
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    cargarCatalogo();

  </script>

</body>

</html>
